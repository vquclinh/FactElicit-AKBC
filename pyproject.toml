[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cover-kbc"
version = "0.1.0"
description = "COVER-KBC v2 - relation-typed active set elicitation for the AKBC Shared Task 2026"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "PyYAML",
]

[project.optional-dependencies]
# Neural backends are optional so that the data/evaluation foundation stays
# installable (and testable) on machines without a GPU stack.
hf = [
    "torch",
    # Active Profile E3/E2/E1/Profile-D runs are Mistral-only. Historical Qwen configs still
    # fail closed through `cover_kbc.models.preflight` if attempted on an older
    # transformers build, but the current pipeline no longer requires Qwen's
    # stricter 5.2.0 architecture floor.
    "transformers>=4.52.4",
    "accelerate",
    # Mistral-Small-3.2 ships a Tekken tokenizer; AutoTokenizer cannot
    # round-trip it, so the checkpoint-native tokenizer is required.
    "mistral-common>=1.6.2",
]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
