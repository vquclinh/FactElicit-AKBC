[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cover-kbc"
version = "0.1.0"
description = "COVER-KBC v2 - relation-typed active set elicitation for the AKBC Shared Task 2026"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "PyYAML",
]

[project.optional-dependencies]
# Neural backends are optional so that the data/evaluation foundation stays
# installable (and testable) on machines without a GPU stack.
hf = [
    "torch",
    # 5.2.0 is the first release that ships `transformers.models.qwen3_5`.
    # The verifier, Qwen/Qwen3.5-4B, declares `model_type: qwen3_5`, so
    # anything older raises "Transformers does not recognize this
    # architecture" at load time - observed on 4.57.6 during a real-weight run
    # (Audit 0065). The earlier `>=4.51.0` floor could never have loaded the
    # verifier, and was also below Mistral-Small-3.2's own `mistral3` minimum
    # of 4.52.4.
    "transformers>=5.2.0",
    "accelerate",
    # Mistral-Small-3.2 ships a Tekken tokenizer; AutoTokenizer cannot
    # round-trip it, so the checkpoint-native tokenizer is required.
    "mistral-common>=1.6.2",
]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
