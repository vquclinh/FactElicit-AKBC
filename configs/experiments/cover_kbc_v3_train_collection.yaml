# COVER-KBC V3 core - future TRAIN collection profile for V3D.
#
# This runs the current two-model backbone plus V3 observability/action
# catalogue surfaces. It is not calibrated V3 production and is not TEST-ready.

experiment:
  name: cover_kbc_v3_train_collection
  split: train
  seed: 42
  notes: >-
    Future V3D TRAIN collection profile. Real-weight run belongs on Colab/A100.
    V3 production calibration and official TEST remain NOT_READY.

model_profile:
  enumerator:
    backend: huggingface
    model_id: "mistralai/Mistral-Small-3.2-24B-Instruct-2506"
    revision: "95a6d26c4bfb886c58daf9d3f7332c857cb27b43"
    family: mistral
    role: enumerator
    license: apache-2.0
    published_checkpoint_parameters: 24011361280
    budget_count_parameters: 24011361280
    published_total_parameters: 24011361280
    parameter_source: "https://huggingface.co/api/models/mistralai/Mistral-Small-3.2-24B-Instruct-2506 (safetensors.total)"
    parameter_source_verified: true
    tokenizer_backend: mistral_common
    quantization: nf4
    torch_dtype: bfloat16
    device_map: auto
  verifier:
    backend: huggingface
    model_id: "Qwen/Qwen3.5-4B"
    revision: "851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a"
    family: qwen
    role: verifier
    license: apache-2.0
    published_checkpoint_parameters: 4659865088
    budget_count_parameters: 4659865088
    published_total_parameters: 4659865088
    parameter_source: "https://huggingface.co/api/models/Qwen/Qwen3.5-4B (safetensors.total)"
    parameter_source_verified: true
    tokenizer_backend: huggingface
    quantization: nf4
    torch_dtype: bfloat16
    device_map: auto

budget_assertion:
  total_published_parameters: 28671226368
  limit: 32000000000
  legal: true

train_dataset:
  rows: 477
  sha256: ad37cd30d1ff4b9f1ef2579b25e64093b202c40da11e8c412e13386f1e5d332e
  identity_sha256: 04b56aa6f401f00ca8d672a8d6cade09cfa2492640aac16a9aab8bc42c1b8054

diagnostics:
  enabled: true
  telemetry_file: inference_telemetry.jsonl

development_subset:
  purpose: deterministic source/debug smoke only; not calibration
  selection: first_n_by_official_train_order
  rows: 24

train_collection:
  policy: collect-v2-coverage
  coverage_target_per_family: 10

v3_calibration_outputs:
  m20_relation_budget: configs/calibration/v3/m20_relation_budget.json
  m21_historical_bins: configs/calibration/v3/m21_historical_bins.json
  m21_planner_calibration: configs/calibration/v3/m21_planner_calibration.json

pipeline:
  mode: interleaved
  enable_active_controller: true
  max_steps_per_query: 12
  max_control_rounds_per_catalogue: 3
  max_calls_per_query: 12
  max_generated_tokens_per_query: 6000
  enable_calibrated_gate: true
  gate_min_margin: 1.0
  gate_min_prob: 0.5
  enable_verifier: true
  use_calibration: true
  max_verifications_per_query: 6
  enable_prompt_disagreement: true
  enable_cross_model_recall: true
  cross_model_view: ""
  v3_core:
    enabled: true
    mode: train_collection
    schema_version: v3-core-v1
    production_calibration_ready: false
  scoring:
    alpha_support: 1.0
    beta_logit: 0.6
    gamma_cross_model: 0.5
    delta_contradiction: 1.5
    eta_disagreement: 1.0
    auto_accept_support: 3
    verify_max_support: 2
    adversarial_disagreement: 0.15
    accept_score: 0.2
    min_valid_prob: 0.40
    drop_on_unknown: true
    logit_clip: 3.0
    logit_epsilon: 1.0e-6
  selection:
    capacity_support_ratio: 1.0
    capacity_trust_verified: true

query_intelligence:
  profiler:
    enabled: true
    mode: shadow
    profile_version: m9-v1
  prompt_compiler:
    enabled: true
    mode: shadow
    compiler_version: m10-v1
  parametric_retrieval:
    enabled: true
    mode: shadow
    retrieval_version: m11-v1
    operations: [pseudo_memory, self_ask, query_rewrite]
    samples_per_operation: 1

specialists:
  numeric:
    enabled: true
    mode: shadow
    specialist_version: m12-v1
    mine_parametric_memory: true
  large_open_set:
    enabled: true
    mode: shadow
    specialist_version: m13-v1
    mine_parametric_memory: true
  null_temporal:
    enabled: true
    mode: shadow
    specialist_version: m14-v1
    min_independent_groups: 1
    conflict_policy: unresolved
    cross_family_recall: false
    mine_parametric_memory: true
  small_set_closure:
    enabled: true
    mode: shadow
    specialist_version: m15-v1
    enable_facets: []
    min_independent_groups: 1
    conflict_policy: unresolved
    cross_family_recall: false
    candidate_explosion_threshold: 0
    mine_parametric_memory: true

consensus:
  enabled: true
  mode: shadow
  consensus_version: m16-v1
  include_parametric_origins: true
  include_query_events: true

specialist_verifier:
  enabled: true
  mode: shadow
  verification_version: m17-v1
  templates: [m17_statement_v1, m17_question_v1]
  bias_controls:
    label_orders: [ABC, BAC]
  use_calibration: true

bidirectional_verification:
  enabled: true
  mode: shadow
  check_version: m18-v1
  supported_checks: [REVERSE, KEY_CONDITION, COUNTERFACTUAL, CANDIDATE_FREE_RECALL]

layer4_integration:
  enabled: true
  mode: shadow
  integration_version: layer4-v1

coverage_gap:
  enabled: true
  mode: shadow
  estimator_version: m19-v1
  weights:
    novelty_rate: 1
    singleton_ratio: 1
    facet_gap: 1
    disagreement: 1
    unresolved_mass: 1

relation_budget_scheduler:
  enabled: false
  mode: shadow
  scheduler_version: m20-v1
  calibration_file: null

micro_planner:
  enabled: false
  mode: shadow
  planner_version: m21-v1
  historical_bins: null
  planner_calibration: null

layer6_integration:
  enabled: false
  mode: shadow
