# COVER-KBC V3.1 TARGETED DIAGNOSTIC - awardWonBy / award_expansion_and_fp_cap
#
# Audit 0077. NON-PRODUCTION, TRAIN ONLY, NOT TEST READY.
#
# Purpose. Measure exactly one Class-B intervention on exactly one relation
# before spending a full 477-row recollection on it.
#   all 10 rows simultaneously under- and over-enumerated: 418 FN, 266 FP.
#
# WHAT THIS CONFIG IS NOT
#   - not a submission profile: split is train and there is no TEST identity;
#   - not production: enabling `award_expansion_and_fp_cap` changes
#     model-generated evidence, so the Audit 0073 M20/M21 calibration does not
#     describe this run. It is reused here ONLY so the diagnostic is comparable
#     against the authoritative TRAIN baseline, and that reuse is a diagnostic
#     control, not a claim of validity;
#   - not a promotion decision: promotion gates are in audit 0077 section 14 and
#     require the real GPU run to have happened.
#
# CALIBRATION STATUS: CALIBRATION_REVIEW_REQUIRED
#
# Rows: 10 (awardWonBy in benchmark/data/train.jsonl).
# The relation filter is a membership test on the query's relation name and
# reads no gold value.
#
# Run:
#   python scripts/run_cover.py \
#     --config configs/experiments/v3_1_diag_award.yaml --no-eval
#
# Then score with the targeted evaluator:
#   python scripts/evaluate_v3_1_diagnostic.py \
#     --relation awardWonBy \
#     --baseline-run outputs/v3_train_collect_v2_coverage/collection/cover_kbc_v3_train_collection_train-collect_20260809T232616Z \
#     --diagnostic-run outputs/<new run dir> \
#     --gold benchmark/data/train.jsonl \
#     --output-dir outputs/v3_1_class_b_diagnostics/award

