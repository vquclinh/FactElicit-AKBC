# Staged-execution plumbing smoke test, with NO neural models.
#
# Exercises the same three-phase code path the frozen Mistral+Qwen architecture
# uses on Colab - enumerate, persist, verify, persist, decide - using the
# non-neural scripted backend. It proves the staging seam works; it says
# nothing about factual quality and must never be reported as a system result.

experiment:
  name: smoke_staged_scripted
  split: val
  seed: 42
  notes: Non-neural staged plumbing check. Not a system result.

model_profile:
  enumerator:
    backend: "scripted"
    model_id: offline/scripted-enumerator
    family: offline-mistral
    role: enumerator
  verifier:
    backend: "scripted"
    model_id: offline/scripted-verifier
    family: offline-qwen
    role: verifier

pipeline:
  mode: staged
  # Controller owns optional-view scheduling; see the target config.
  enable_active_controller: true
  max_steps_per_query: 8
  max_calls_per_query: 8
  max_generated_tokens_per_query: 2000
  enable_calibrated_gate: true
  enable_verifier: true
  use_calibration: true
  max_verifications_per_query: 3
  enable_prompt_disagreement: true
  enable_cross_model_recall: true

# Module 9 - Risk & Difficulty Profiler (Query Intelligence layer).
#
# Shadow mode: M9 profiles every query at the M0 -> M1 -> M9 seam and writes
# query_profiles.jsonl, but no M2-M8 decision reads the result. Module 10 will
# be its first consumer. Enabling or disabling this cannot change predictions,
# neural calls, candidate graphs or any core decision - that invariance is
# asserted in tests/test_query_profiler.py.
#
# Priors live in src/cover_kbc/query_intelligence/priors.py, versioned by
# profile_version. No value here was selected from TRAIN, VAL or TEST
# performance; none is learned.
query_intelligence:
  profiler:
    enabled: true
    mode: shadow
    profile_version: m9-v1
  # Module 10 - Prompt Program Compiler.
  #
  # Shadow mode: M10 consumes M9's risk profile at the same seam and compiles a
  # typed prompt blueprint into prompt_programs.jsonl. Module 2's view
  # templates and Module 4's verifier prompts are untouched, and no M0-M8
  # decision reads a program. Module 11 will be its first consumer.
  #
  # Prompt language lives in query_intelligence/prompt_registry.py, versioned by
  # compiler_version. Semantic cues are lexical steering placed inside prompts;
  # they are never sent to any external system. Nothing here was selected from
  # TRAIN, VAL or TEST performance.
  prompt_compiler:
    enabled: true
    mode: shadow
    compiler_version: m10-v1
  # Module 11 - Closed-Book Parametric Retrieval.
  #
  # DISABLED BY DEFAULT, and deliberately so: unlike M9 and M10 this module
  # spends real neural calls. Enabling it adds shadow probes whose cost is
  # counted separately from the production path and never draws on Module 7's
  # per-query budget.
  #
  # Not RAG. There is no retriever, corpus, index or cache - the only factual
  # source is the frozen model's own weights, and every record is marked
  # unverified parametric memory. Probe families follow the proposal's three
  # (pseudo-memory sketch, self-ask decomposition, query rewrite).
  parametric_retrieval:
    enabled: false
    mode: shadow
    retrieval_version: m11-v1
    operations:
      - pseudo_memory
      - self_ask
      - query_rewrite
    samples_per_operation: 1

# Layer 2 relation-family specialists.
#
# Module 12 - Numeric Specialist (hasCapacity, hasArea).
#
# DISABLED BY DEFAULT: like M11 it spends real neural calls, and its output
# feeds no production decision until M16 (consensus) and M17 (specialist
# verification) exist to decide how. Requires M9, M10 and M11 enabled.
#
# It parses numbers, converts units mathematically, classifies which quantity
# the model named, and clusters target values with the contract's own tolerance.
# It decides nothing: there is no ACCEPT rule and no acceptance flag here.
specialists:
  numeric:
    enabled: false
    mode: shadow
    specialist_version: m12-v1
    mine_parametric_memory: true

  # Module 13 - Large-Open-Set Specialist (awardWonBy).
  #
  # DISABLED BY DEFAULT: it spends real neural calls, and its output feeds no
  # production decision until M16 (consensus) and M17 (verification) exist.
  # Requires M9, M10 and M11 - but NOT M12: the two specialists are siblings
  # over disjoint relations and are independently enableable.
  #
  # It runs a seed query and partitions the recall space into the proposal's
  # generic non-factual facets, collecting atomic candidate mentions with full
  # provenance. It decides nothing: no acceptance, no score, no pruning.
  large_open_set:
    enabled: false
    mode: shadow
    specialist_version: m13-v1
    mine_parametric_memory: true

  # Module 14 - Null/Temporal Specialist (personHasCityOfDeath).
  #
  # DISABLED BY DEFAULT: it spends real neural calls, and its output feeds no
  # production decision until M16/M17/M18 exist. Requires M9, M10 and M11 - but
  # NOT M12 or M13: the three specialists are siblings over disjoint relations.
  #
  # Stage A asks whether a death exists; the local gate decides whether Stage B
  # may spend calls looking for a locality. Nothing here accepts a city or
  # declares an answer empty - see §10.3's three distinct NULL-evidence classes.
  #
  # cross_family_recall is §10.2's branch. It runs only when enabled AND a
  # genuinely distinct second model family is configured AND Module 9 graded the
  # relation temporally sensitive. It makes no claim that either frozen
  # checkpoint is fresher than the other; "cross-family" is an architectural
  # role, not a statement about knowledge cutoffs.
  null_temporal:
    enabled: false
    mode: shadow
    specialist_version: m14-v1
    min_independent_groups: 1
    conflict_policy: unresolved
    cross_family_recall: false
    mine_parametric_memory: true

  # Module 15 - Small-Set Closure Specialist (borders, stock exchanges).
  #
  # DISABLED BY DEFAULT: it spends real neural calls, and its output feeds no
  # production decision until M16/M17/M18 exist. Requires M9, M10 and M11 - not
  # M12, M13 or M14; the four Layer-2 specialists are siblings.
  #
  # §11.1 borders: minimal-change. Two calls - geographic decomposition plus the
  # §11.3 missingness probe. The direct probe is declared but off, because
  # Module 11 already asks the relation directly; enable_facets turns it on.
  #
  # §11.2 stock: a public-listing gate decides whether the listing facets spend
  # calls. cross_family_recall is §11.2's "M14's freshness branch ... as a
  # subroutine", using the shared primitive, and makes no freshness claim.
  #
  # M15 closes nothing: §11.3's rule needs an accepted set that M16/M17 will
  # provide. There is no should_stop and no final verdict here.
  small_set_closure:
    enabled: false
    mode: shadow
    specialist_version: m15-v1
    enable_facets: []
    min_independent_groups: 1
    conflict_policy: unresolved
    cross_family_recall: false
    candidate_explosion_threshold: 0
    mine_parametric_memory: true

# Layer 3 - Module 16 Atomic Consensus Engine.
#
# Non-neural: it fuses evidence Modules 3/4 and the applicable Layer-2
# specialist already produced, spends zero calls and changes no prediction.
# Shadow-only and off by default until Modules 17 and 18 exist to consume it.
#
# Requires M9, M10, M11 and the specialist that OWNS each relation in the run -
# not all four. There are deliberately no score weights here: M16 produces the
# support vector phi(o) = (F, L, X, C, U, I, D, cost, risk), not a score.
consensus:
  enabled: false
  mode: shadow
  consensus_version: m16-v1
  # Register M11's records as query-level origins, so a specialist observation
  # mined from one is recognisable as a description of an output already paid
  # for, rather than a second independent support.
  include_parametric_origins: true
  # Emit query-level events (gates, null classes, M11 records) in the artefact.
  include_query_events: true

# Layer 4 - Module 17 Specialist Verifier Suite.
#
# Proposal §13: "A single generic A/B/C prompt is too coarse for all relations."
# Each relation gets its own verifier contract (Table 5), scored by the SAME
# frozen Qwen verifier role and the SAME Module 4 calibrated kernel. No third
# model, no fitted calibrator, and no experimental decoding adapter - the
# proposal places that under Module 18 and it is not implemented.
#
# Shadow-only and off by default: M17 spends real verifier calls and nothing
# downstream consumes its labels yet. When enabled, the pipeline builds only the
# deterministic catalogue of verifiable targets - choosing which targets are
# worth a call is Module 20/21's, and an automatic fan-out here would be an
# implicit budget policy.
specialist_verifier:
  enabled: false
  mode: shadow
  verification_version: m17-v1
  # Two semantically equivalent phrasings, so §13.1's template disagreement is
  # measurable. A = VALID, B = INVALID, C = UNKNOWN in every one of them.
  templates:
    - m17_statement_v1
    - m17_question_v1
  bias_controls:
    # §13.1's label-order swaps. PRESENTATION ORDER ONLY - the letters keep
    # their meanings, and each variant is calibrated by its own content-free
    # control so no order's bias is ever subtracted from another's.
    label_orders:
      - ABC
      - BAC
  # Module 4's contextual calibration (T = 1, nothing fitted).
  use_calibration: true

# Layer 4 - Module 18 Bidirectional and Counterfactual Verification.
#
# Proposal §14: "M18 creates genuinely new evidence instead of issuing a generic
# 'think again' instruction." Four mechanisms - reverse check, key-condition
# reconstruction, counterfactual pair, candidate-free recall - each asking a
# structurally different question rather than rewording Module 17's.
#
# Shadow-only and off by default. Enabling it builds the deterministic catalogue
# of eligible checks and executes NOTHING: every check spends a real call, and
# deciding which is worth one is Module 20/21's. A caller runs checks explicitly.
#
# The optional §14.1 factual-decoding adapter is deliberately absent: the
# proposal makes it experimental and conditional on a validation ablation that
# cannot run during architecture construction.
bidirectional_verification:
  enabled: false
  mode: shadow
  check_version: m18-v1
  # Which §14 mechanisms the catalogue may offer. Counterfactual near-miss
  # classes are never listed here - they come from the relation contract's own
  # hard-negative rules, so this file cannot invent one.
  supported_checks:
    - REVERSE
    - KEY_CONDITION
    - COUNTERFACTUAL
    - CANDIDATE_FREE_RECALL

# Layer 4 boundary - verification evidence integration.
#
# NOT a new numbered module. It projects Module 16's consensus, Module 17's
# calibrated verifications and Module 18's structural checks into one
# deterministic evidence state for Module 19 to consume.
#
# Non-neural: zero calls, zero tokens. It integrates what explicit callers
# already executed and never fills a gap by running something itself.
# atomic_consensus.jsonl stays byte-identical, so the M16 / M16+M17 /
# M16+M17+M18 ablations remain honest.
#
# Deterministic, so there is nothing to tune: no threshold, no weight, no
# cutoff, no stop value.
layer4_integration:
  enabled: false
  mode: shadow
  integration_version: layer4-v1

# Layer 5 - Module 19 Coverage Gap and Missingness Estimator.
#
# Proposal §15's non-neural ensemble:
#   R_t = w1*noveltyRate + w2*singletonRatio + w3*facetGap
#       + w4*disagreement + w5*unresolvedMass
#
# R_t is a HEURISTIC residual search-need index in [0, 1]. It is NOT a
# probability, not an estimate of unseen objects, not factual confidence and
# not a stopping decision - Module 21 owns STOP.
#
# Zero neural calls. Module 6's RCSE is untouched and still owns production
# q_res; M19 is the upgraded shadow estimator beside it.
#
# §15 names w1..w5 but supplies no values, and fitting them would need
# TRAIN/VAL, which architecture construction may not read. The neutral uniform
# vector is used and recorded as weight_source = uniform_unfitted. With uniform
# weights R_t is exactly the mean of the AVAILABLE components - an unavailable
# component is dropped and the rest renormalised, never read as zero.
coverage_gap:
  enabled: false
  mode: shadow
  estimator_version: m19-v1
  weights:
    novelty_rate: 1
    singleton_ratio: 1
    facet_gap: 1
    disagreement: 1
    unresolved_mass: 1

# Layer 6 - Module 20 Relation Budget Scheduler.
#
# Proposal §16: M20 allocates budget by relation and reserves budget by action
# class. Accounting is cache-aware, precharges before every neural call, and
# no action may exceed the hard cap. §9.3 gives the decomposition:
#   B_r = B_seed + B_facet + B_verify + B_reverse + B_reserve
# where B_verify is a hard reservation that discovery cannot spend.
#
# Zero neural calls: M20 reasons about calls, it does not make them. Module 7
# remains the production budget authority and is neither replaced nor charged.
#
# DISABLED, AND DELIBERATELY UNCALIBRATED. §16 states that concrete values are
# "calibrated on TRAIN", and that calibration has not been performed. No call
# counts, reserve sizes or class caps appear here, because an invented number
# would be indistinguishable from a measured one. Enabling the scheduler
# without a calibration file fails loudly rather than defaulting to a guess.
relation_budget_scheduler:
  enabled: false
  mode: shadow
  scheduler_version: m20-v1
  calibration_file: null

# Layer 6 - Module 21 Expected-Value Micro-Planner.
#
# Proposal §17:
#   U_t(a) = alpha*G_verified(a) + beta*dR(a) + gamma*dH(a)
#          - delta*Cost(a) - eta*Redundancy(a) - kappa*FP(a)
#   a* = argmax U_t(a) if U_t(a*) > tau_continue, otherwise STOP.
#
# "1-2 step micro-lookahead over a small action space." No MCTS, no beam
# search, no third step. Zero neural calls: M21 reasons over recorded state
# and deterministic historical statistics, and executes nothing.
#
# DISABLED, AND DELIBERATELY UNCALIBRATED. §17 states the estimates come from
# relation-specific historical bins on TRAIN, and supplies no value for any of
# alpha, beta, gamma, delta, eta, kappa or tau_continue. No TRAIN bins have
# been built. Shipping invented coefficients would produce confident-looking
# decisions with nothing behind them, so enabling the planner without both a
# history package and a calibration fails loudly.
#
# M7 remains the production controller and M8 the finaliser; M21 selects
# nothing in production and its decision is observability only.
micro_planner:
  enabled: false
  mode: shadow
  planner_version: m21-v1
  historical_bins: null
  planner_calibration: null
