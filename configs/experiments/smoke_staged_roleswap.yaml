# Multi-role-swap staged smoke, with NO neural models.
#
# Exercises the full Algorithm-1 outer loop the frozen Mistral+Qwen
# architecture uses on Colab: enumerate -> verify -> role swap back to the
# enumerator -> ... -> STOP, using the non-neural scripted backend. It proves
# the control contract survives model residency changes; it says nothing about
# factual quality and must never be reported as a system result.

experiment:
  name: smoke_staged_roleswap
  split: val
  seed: 42
  notes: Non-neural staged role-swap check. Not a system result.

model_profile:
  enumerator:
    backend: "scripted"
    model_id: offline/scripted-enumerator
    family: offline-mistral
    role: enumerator
    # Canned text so the loop has candidates to reason about. Not facts.
    default_response: "Alpha"
    responses:
      award_direct: "Alpha; Gamma"
  verifier:
    backend: "scripted"
    model_id: offline/scripted-verifier
    family: offline-qwen
    role: verifier
    # The second model independently recalls a name the enumerator never
    # produced, which is what leaves enumerator-role work after verification.
    default_response: "Delta"

pipeline:
  mode: staged
  enable_active_controller: true
  max_steps_per_query: 10
  max_calls_per_query: 24
  max_generated_tokens_per_query: 4000
  enable_calibrated_gate: false
  enable_verifier: true
  use_calibration: true
  max_verifications_per_query: 4
  enable_prompt_disagreement: true
  enable_cross_model_recall: true

# Module 9 - Risk & Difficulty Profiler (Query Intelligence layer).
#
# Shadow mode: M9 profiles every query at the M0 -> M1 -> M9 seam and writes
# query_profiles.jsonl, but no M2-M8 decision reads the result. Module 10 will
# be its first consumer. Enabling or disabling this cannot change predictions,
# neural calls, candidate graphs or any core decision - that invariance is
# asserted in tests/test_query_profiler.py.
#
# Priors live in src/cover_kbc/query_intelligence/priors.py, versioned by
# profile_version. No value here was selected from TRAIN, VAL or TEST
# performance; none is learned.
query_intelligence:
  profiler:
    enabled: true
    mode: shadow
    profile_version: m9-v1
  # Module 10 - Prompt Program Compiler.
  #
  # Shadow mode: M10 consumes M9's risk profile at the same seam and compiles a
  # typed prompt blueprint into prompt_programs.jsonl. Module 2's view
  # templates and Module 4's verifier prompts are untouched, and no M0-M8
  # decision reads a program. Module 11 will be its first consumer.
  #
  # Prompt language lives in query_intelligence/prompt_registry.py, versioned by
  # compiler_version. Semantic cues are lexical steering placed inside prompts;
  # they are never sent to any external system. Nothing here was selected from
  # TRAIN, VAL or TEST performance.
  prompt_compiler:
    enabled: true
    mode: shadow
    compiler_version: m10-v1
  # Module 11 - Closed-Book Parametric Retrieval.
  #
  # DISABLED BY DEFAULT, and deliberately so: unlike M9 and M10 this module
  # spends real neural calls. Enabling it adds shadow probes whose cost is
  # counted separately from the production path and never draws on Module 7's
  # per-query budget.
  #
  # Not RAG. There is no retriever, corpus, index or cache - the only factual
  # source is the frozen model's own weights, and every record is marked
  # unverified parametric memory. Probe families follow the proposal's three
  # (pseudo-memory sketch, self-ask decomposition, query rewrite).
  parametric_retrieval:
    enabled: false
    mode: shadow
    retrieval_version: m11-v1
    operations:
      - pseudo_memory
      - self_ask
      - query_rewrite
    samples_per_operation: 1

# Layer 2 relation-family specialists.
#
# Module 12 - Numeric Specialist (hasCapacity, hasArea).
#
# DISABLED BY DEFAULT: like M11 it spends real neural calls, and its output
# feeds no production decision until M16 (consensus) and M17 (specialist
# verification) exist to decide how. Requires M9, M10 and M11 enabled.
#
# It parses numbers, converts units mathematically, classifies which quantity
# the model named, and clusters target values with the contract's own tolerance.
# It decides nothing: there is no ACCEPT rule and no acceptance flag here.
specialists:
  numeric:
    enabled: false
    mode: shadow
    specialist_version: m12-v1
    mine_parametric_memory: true
