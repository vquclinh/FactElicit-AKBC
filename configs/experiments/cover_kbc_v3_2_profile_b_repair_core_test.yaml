pipeline:
  mode: interleaved
  enable_active_controller: true
  max_steps_per_query: 12
  max_control_rounds_per_catalogue: 3
  max_calls_per_query: 12
  max_generated_tokens_per_query: 6000
  enable_calibrated_gate: true
  gate_min_margin: 1.0
  gate_min_prob: 0.5
  enable_verifier: true
  use_calibration: true
  max_verifications_per_query: 6
  enable_prompt_disagreement: true
  enable_cross_model_recall: true
  cross_model_view: ""
  v3_core:
    enabled: true
    mode: production
    schema_version: v3-core-v1
    production_calibration_ready: true
  scoring:
    alpha_support: 1.0
    beta_logit: 0.6
    gamma_cross_model: 0.5
    delta_contradiction: 1.5
    eta_disagreement: 1.0
    auto_accept_support: 3
    verify_max_support: 2
    adversarial_disagreement: 0.15
    accept_score: 0.2
    min_valid_prob: 0.40
    drop_on_unknown: true
    logit_clip: 3.0
    logit_epsilon: 1.0e-6
  selection:
    capacity_support_ratio: 1.0
    capacity_trust_verified: true
    v3_1:
      enabled: true
      safe:
        # FINAL_CANDIDATE_RETENTION. Numeric cluster order breaks size ties on the
        # smallest representative, which ignores acceptance, so a query whose only
        # ACCEPTED candidate was the larger singleton emitted nothing at all. 55
        # TRAIN rows had a non-empty CONTROL_SURVIVED stage and an empty output.
        final_candidate_retention: true
        # Repair leaked "<bucket label>: <payload>" enumeration lines and drop the
        # ones whose payload is an abstention token. 76 awardWonBy values on TRAIN.
        enumeration_label_repair: true
        # Stock only. Keep maximally supported listings when supports differ; keep
        # all on a tie, so multi-listed companies are not capped. Improves 12 TRAIN
        # rows and harms 7, for a net stock macro-F1 of +0.00700.
        # OFF for the clean V3.2 stock prompt background. The repair-core
        # profile tests L7-L9 on top of A, not SAFE_FULL stock dominance.
        stock_support_dominance: false
        # Guardrail. 0 TRAIN rows affected; ticker rejection deliberately absent.
        stock_structural_validation: true
        # Guardrail. 0 TRAIN rows affected. Converts only on an explicit unit.
        numeric_output_canonicalization: true
      aggressive:
        capacity_definition_prompt: false
        city_of_death_contrast_prompt: false
        stock_listing_entity_prompt: true
        award_expansion_and_fp_cap: false
        scientific_notation_acquisition: false

