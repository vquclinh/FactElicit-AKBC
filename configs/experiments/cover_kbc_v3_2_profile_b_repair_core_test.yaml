# COVER-KBC V3.1 SAFE - official blind TEST profile with Class A score recovery.
#
# Audit 0076. Identical to configs/experiments/cover_kbc_v3_test.yaml except for
# the experiment block and the `selection.v3_1` block. It reuses the *exact*
# Audit 0073 M20/M21 calibration artifacts and hashes, unchanged, because every
# feature it enables runs at Module 8 or later.
#
# Why that reuse is legitimate: for one query the pipeline runs consensus (M16),
# then the V3 control loop (M20/M21 and action execution), and only then
# `selection.finalize` (M8). The pre-M8 hypothesis graph Module 21 reads is built
# by `pipeline._v3_hypothesis_graph` with `prediction=None`, so nothing a
# finalizer decides can reach action eligibility, action execution, action cost,
# state transitions, hypothesis construction, M21 input state or M20 budget
# behaviour. The only hypothesis graph that sees a prediction is the post-hoc
# observation graph, which is telemetry.
#
# Offline TRAIN replay of these five features over the persisted 477-row run:
#   macro-F1 0.40333 -> 0.42000 (+0.01667); micro-F1 0.51799 -> 0.53079
#   27 rows improved, 7 harmed, 443 unchanged
#   countryLandBordersCountry: 0 rows changed, macro-F1 0.964369 unchanged
#
# Readiness must fail if any enabled feature is not classified
# SAFE_WITH_EXISTING_CALIBRATION in cover_kbc.v3_1.compatibility.

