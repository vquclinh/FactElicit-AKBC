  name: cover_kbc_v3_1_safe_core_test
  split: test
  seed: 42
  notes: >-
    Official blind TEST submission run for COVER-KBC V3.1 SAFE: the calibrated
    V3 TEST profile plus Class A finalization-only score recovery. Requires a
    GPU runtime; intended for Colab/A100. No evaluation is performed on TEST.

