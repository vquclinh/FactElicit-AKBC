# COVER-KBC V3.1 SAFE_CORE - the conservative half of the V3.1 safe matrix.
#
# Audit 0077. Identical to cover_kbc_v3_1_safe_full_test.yaml except that
# `stock_support_dominance` is OFF.
#
# Why the matrix exists. Audit 0076 measured stock_support_dominance at
# +0.00147 overall TRAIN macro-F1: it improves 12 rows and harms 7, and 3 of
# the harmed rows fall to F1 0.0 because the dropped listing was the gold one
# (Nautilus, Tokmanni, GD Power Development). Every other safe feature is
# monotone - 0 harmed rows. Conflating a monotone stack with a coin-flip trade
# in one submission wastes the information that separate submissions buy.
#
# SAFE_CORE is the variant to submit if you want only changes that harmed no
# TRAIN row.
#
# Offline TRAIN replay over the persisted 477-row run:
#   macro-F1 0.40333 -> 0.41853 (+0.01520); micro-F1 0.51799 -> 0.53065
#   15 rows improved, 0 harmed, 462 unchanged
#   countryLandBordersCountry: 0 rows changed, macro-F1 0.964369 unchanged
#
# Uses the exact Audit 0073 M20/M21 calibration artifacts and hashes, unchanged.
# Contains no Class-B feature and no collection mode.

