# COVER-KBC v2 - heterogeneous portfolio, DIRECT (UNCALIBRATED) official TEST.
#
# Submission #2. The question it answers is narrow and deliberate:
#
#     does replacing the model stack help, on its own?
#
# So the whole upgraded architecture runs - M0 through M21, Layer 4 evidence
# reaching Module 8 through the production bridge - while Modules 20 and 21
# govern nothing, because no calibration exists for these checkpoints. The two
# alternatives were both worse: borrowing the baseline's packages would measure
# Mistral's action economics driving Gemma's actions, and deriving anything
# from the split being answered would not be a measurement at all.
#
#   controller       fixed deterministic policy (the collection policy)
#   M20 / M21        disabled - they govern nothing and load nothing
#   production_calibrated  false
#
# This is NOT `cover_kbc_v2_portfolio_test.yaml`. That config is the future
# CALIBRATED path and stays NOT_READY until real portfolio M20/M21 artifacts
# exist. The two must never be conflated in a paper: they are experiments B
# and C, and only C is calibrated.
#
# What still bounds the run, none of it TRAIN-derived:
#   - Module 7's max_calls_per_query / max_steps_per_query /
#     max_generated_tokens_per_query;
#   - max_control_rounds_per_catalogue, the per-catalogue action bound;
#   - the reservation lifecycle and process-fatal AccountingInvariantError;
#   - each model's own context limit.
#
# TEST is blind: every row ships an empty ObjectEntities list, the gate refuses
# the run if any row carries objects, and no evaluator runs on this split.

experiment:
  name: cover_kbc_v2_portfolio_test_direct
  split: test
  seed: 42
  notes: >-
    Direct uncalibrated official TEST run on the heterogeneous portfolio.
    Modules 20 and 21 govern nothing; action choice is the fixed deterministic
    policy. Not a calibrated run and must never be reported as one.

# Names this run's variant so a manifest, and later a paper, never has to infer
# it. `controller_mode: direct_uncalibrated` is what the runner reads to select
# the execution-complete-but-uncalibrated integration mode.
controller_mode: direct_uncalibrated
experiment_variant: portfolio_direct

model_strategy: portfolio

# Resolved from each checkpoint's own Hugging Face metadata, not from its name.
# `published_total_parameters` is the full instantiated `safetensors.total`.
#
# MULTIMODAL ACCOUNTING. Gemma 3 and Qwen3.5 are multimodal checkpoints whose
# official classes - Gemma3ForConditionalGeneration and
# Qwen3_5ForConditionalGeneration - instantiate the vision tower whether or not
# a prompt contains an image. This repository loads those official classes, so
# the tower is counted. Counting only the language stack would assert a
# text-only class we do not load. Nemotron is text-only.
#
#   google/gemma-3-12b-it              12,187,325,040
#   nvidia/NVIDIA-Nemotron-Nano-9B-v2   8,888,227,328
#   Qwen/Qwen3.5-9B                     9,653,104,368
#   -----------------------------------------------
#   TOTAL                              30,728,656,736
#   Limit                              32,000,000,000
#   Legal                              true (1.27B spare)
#
# Quantization is a memory decision. It does not reduce any count above.
model_portfolio:
  factual_enumerator:
    backend: huggingface
    model_id: "google/gemma-3-12b-it"
    revision: "96b6f1eccf38110c56df3a15bffe176da04bfd80"
    family: gemma
    role: factual_enumerator
    license: gemma
    gated: true
    access_note: >-
      Gated (manual approval). Accept the Gemma terms on Hugging Face and
      supply the token through the environment or the HF cache. No credential
      is recorded in this repository, and there is no fallback: without access
      the portfolio fails with that reason rather than substituting a model.
    tokenizer_backend: huggingface
    processor: AutoProcessor
    architecture: Gemma3ForConditionalGeneration
    instantiated_components: "language model + SigLIP vision tower (both loaded)"
    trust_remote_code: false
    custom_code_files: []
    context_length: 128000
    transformers_requirement: ">=4.50"
    published_total_parameters: 12187325040
    budget_count_parameters: 12187325040
    parameter_source: "https://huggingface.co/api/models/google/gemma-3-12b-it (safetensors.total, BF16 12187325040)"
    parameter_source_verified: true
    quantization: nf4
    torch_dtype: bfloat16
    device_map: auto

  structural_reasoner:
    backend: huggingface
    model_id: "nvidia/NVIDIA-Nemotron-Nano-9B-v2"
    revision: "6533e8de2c68e4536bf7c411d7a3ce5734111476"
    family: nemotron
    role: structural_reasoner
    license: nvidia-open-model-license
    gated: false
    tokenizer_backend: huggingface
    architecture: NemotronHForCausalLM
    instantiated_components: "hybrid Mamba2-Transformer language model (text only)"
    # Required: config.json declares an auto_map onto repository-local modules.
    trust_remote_code: true
    custom_code_files:
      - configuration_nemotron_h.py
      - modeling_nemotron_h.py
    context_length: 131072
    transformers_requirement: ">=4.51.3"
    published_total_parameters: 8888227328
    budget_count_parameters: 8888227328
    parameter_source: "https://huggingface.co/api/models/nvidia/NVIDIA-Nemotron-Nano-9B-v2 (safetensors.total, BF16 8888227328)"
    parameter_source_verified: true
    quantization: nf4
    torch_dtype: bfloat16
    device_map: auto

  # Qwen3.5-**9B**. The baseline keeps Qwen3.5-4B; these are different models
  # and the portfolio must never fall back to the smaller one.
  independent_verifier:
    backend: huggingface
    model_id: "Qwen/Qwen3.5-9B"
    revision: "c202236235762e1c871ad0ccb60c8ee5ba337b9a"
    family: qwen
    role: independent_verifier
    license: apache-2.0
    gated: false
    tokenizer_backend: huggingface
    processor: AutoProcessor
    architecture: Qwen3_5ForConditionalGeneration
    instantiated_components: "language model + vision tower (both loaded; 333 of 775 tensors are vision)"
    trust_remote_code: false
    custom_code_files: []
    context_length: 262144
    transformers_requirement: ">=4.57"
    published_total_parameters: 9653104368
    budget_count_parameters: 9653104368
    parameter_source: "https://huggingface.co/api/models/Qwen/Qwen3.5-9B (safetensors.total, BF16 9653100528 + F32 3840)"
    parameter_source_verified: true
    quantization: nf4
    torch_dtype: bfloat16
    device_map: auto

budget_assertion:
  total_published_parameters: 30728656736
  limit: 32000000000
  legal: true

# ---------------------------------------------------------------------------
# Everything below is the frozen baseline profile, unchanged, so the bake-off
# isolates the model portfolio as the single independent variable.
# ---------------------------------------------------------------------------

# The exact official blind split this submission answers. There is no
# `calibration_provenance` block, and that absence is the point: this run has
# no calibration to have provenance for.
test_dataset:
  path: benchmark/data/test.jsonl
  rows: 477
  sha256: 849f565d6fcf53f60b74e53503d1ac119933e823f191030b34befe0df044fc1f
  identity_sha256: 1bce6d40f843f7c743af6d896f2a390c4e210eac32d95f64d2887e5373fc2609
  blind: true

pipeline:
  mode: interleaved
  enable_active_controller: true
  max_steps_per_query: 12
  max_calls_per_query: 12
  max_generated_tokens_per_query: 6000
  max_control_rounds_per_catalogue: 3

  enable_calibrated_gate: true
  gate_min_margin: 1.0
  gate_min_prob: 0.5

  enable_verifier: true
  use_calibration: true
  max_verifications_per_query: 6
  enable_prompt_disagreement: true

  enable_cross_model_recall: true
  cross_model_view: ""

  scoring:
    alpha_support: 1.0
    beta_logit: 0.6
    gamma_cross_model: 0.5
    delta_contradiction: 1.5
    eta_disagreement: 1.0
    auto_accept_support: 3
    verify_max_support: 2
    adversarial_disagreement: 0.15
    accept_score: 0.2
    min_valid_prob: 0.40
    drop_on_unknown: true
    logit_clip: 3.0
    logit_epsilon: 1.0e-6

  selection:
    capacity_support_ratio: 1.0
    capacity_trust_verified: true

  controller:
    alpha_yield: 1.0
    beta_gap: 1.0
    gamma_uncertainty: 0.8
    lambda_cost: 0.15
    rho_redundancy: 1.0
    residual_stop: 0.25
    saturation_patience: 2
    stability_threshold: 1.0
    verify_first_unresolved: 0.5
    rcse:
      saturation_window: 3
      w_yield: 1.0
      w_saturation: 1.0
      w_unresolved: 0.8
      w_facet_gap: 1.0
      w_disagreement: 0.6
      w_instability: 0.8
      stop_threshold: 0.25

query_intelligence:
  profiler:
    enabled: true
    mode: shadow
    profile_version: m9-v1
  prompt_compiler:
    enabled: true
    mode: shadow
    compiler_version: m10-v1
  parametric_retrieval:
    enabled: true
    mode: shadow
    retrieval_version: m11-v1
    operations:
      - pseudo_memory
      - self_ask
      - query_rewrite
    samples_per_operation: 1

specialists:
  numeric:
    enabled: true
    mode: shadow
    specialist_version: m12-v1
    mine_parametric_memory: true

  large_open_set:
    enabled: true
    mode: shadow
    specialist_version: m13-v1
    mine_parametric_memory: true

  null_temporal:
    enabled: true
    mode: shadow
    specialist_version: m14-v1
    min_independent_groups: 1
    conflict_policy: unresolved
    cross_family_recall: false
    mine_parametric_memory: true

  small_set_closure:
    enabled: true
    mode: shadow
    specialist_version: m15-v1
    enable_facets: []
    min_independent_groups: 1
    conflict_policy: unresolved
    cross_family_recall: false
    candidate_explosion_threshold: 0
    mine_parametric_memory: true

consensus:
  enabled: true
  mode: shadow
  consensus_version: m16-v1
  include_parametric_origins: true
  include_query_events: true

specialist_verifier:
  enabled: true
  mode: shadow
  verification_version: m17-v1
  templates:
    - m17_statement_v1
    - m17_question_v1
  bias_controls:
    label_orders:
      - ABC
      - BAC
  use_calibration: true

bidirectional_verification:
  enabled: true
  mode: shadow
  check_version: m18-v1
  supported_checks:
    - REVERSE
    - KEY_CONDITION
    - COUNTERFACTUAL
    - CANDIDATE_FREE_RECALL

layer4_integration:
  enabled: true
  mode: shadow
  integration_version: layer4-v1

coverage_gap:
  enabled: true
  mode: shadow
  estimator_version: m19-v1
  weights:
    novelty_rate: 1
    singleton_ratio: 1
    facet_gap: 1
    disagreement: 1
    unresolved_mass: 1

# Layer 6 is OFF, exactly as the canonical baseline TRAIN collection has it.
# There is no portfolio calibration - producing one is what this run is for -
# and `build_relation_budget_scheduler` refuses to construct an enabled
# scheduler with no TRAIN-derived values rather than inventing any. Action
# choice comes from the fixed deterministic collection policy; spend is bounded
# by Module 7's per-query ceilings and `max_control_rounds_per_catalogue`,
# which are architecture caps, not calibrated budgets.
relation_budget_scheduler:
  enabled: false
  mode: shadow
  scheduler_version: m20-v1
  calibration_file: null

micro_planner:
  enabled: false
  mode: shadow
  planner_version: m21-v1
  historical_bins: null
  planner_calibration: null

layer6_integration:
  enabled: false
  mode: shadow
  integration_version: layer6-v1
