# COVER-KBC V3 core scripted shadow run.
#
# Non-neural local development profile. It exercises V3 hypothesis graph and
# relation-conditioned action legality without claiming factual quality,
# calibration, or TEST readiness.

experiment:
  name: cover_kbc_v3_shadow_scripted
  split: val
  seed: 42
  notes: Scripted V3 core shadow profile; not a leaderboard run.

model_profile:
  enumerator:
    backend: scripted
    model_id: offline/scripted-enumerator
    family: offline-mistral
    role: enumerator
  verifier:
    backend: scripted
    model_id: offline/scripted-verifier
    family: offline-qwen
    role: verifier

pipeline:
  mode: interleaved
  enable_active_controller: true
  max_steps_per_query: 8
  max_calls_per_query: 8
  max_generated_tokens_per_query: 2000
  enable_calibrated_gate: true
  enable_verifier: true
  use_calibration: true
  max_verifications_per_query: 3
  enable_prompt_disagreement: true
  enable_cross_model_recall: true
  v3_core:
    enabled: true
    mode: shadow
    schema_version: v3-core-v1
    production_calibration_ready: false

query_intelligence:
  profiler:
    enabled: true
    mode: shadow
    profile_version: m9-v1
  prompt_compiler:
    enabled: true
    mode: shadow
    compiler_version: m10-v1
  parametric_retrieval:
    enabled: true
    mode: shadow
    retrieval_version: m11-v1
    operations: [pseudo_memory, self_ask, query_rewrite]
    samples_per_operation: 1

specialists:
  numeric:
    enabled: true
    mode: shadow
    specialist_version: m12-v1
    mine_parametric_memory: true
  large_open_set:
    enabled: true
    mode: shadow
    specialist_version: m13-v1
    mine_parametric_memory: true
  null_temporal:
    enabled: true
    mode: shadow
    specialist_version: m14-v1
    min_independent_groups: 1
    conflict_policy: unresolved
    cross_family_recall: false
    mine_parametric_memory: true
  small_set_closure:
    enabled: true
    mode: shadow
    specialist_version: m15-v1
    enable_facets: []
    min_independent_groups: 1
    conflict_policy: unresolved
    cross_family_recall: false
    candidate_explosion_threshold: 0
    mine_parametric_memory: true

consensus:
  enabled: true
  mode: shadow
  consensus_version: m16-v1
  include_parametric_origins: true
  include_query_events: true

specialist_verifier:
  enabled: true
  mode: shadow
  verification_version: m17-v1
  templates: [m17_statement_v1, m17_question_v1]
  bias_controls:
    label_orders: [ABC, BAC]
  use_calibration: true

bidirectional_verification:
  enabled: true
  mode: shadow
  check_version: m18-v1
  supported_checks: [REVERSE, KEY_CONDITION, COUNTERFACTUAL, CANDIDATE_FREE_RECALL]

layer4_integration:
  enabled: true
  mode: shadow
  integration_version: layer4-v1

coverage_gap:
  enabled: true
  mode: shadow
  estimator_version: m19-v1
  weights:
    novelty_rate: 1
    singleton_ratio: 1
    facet_gap: 1
    disagreement: 1
    unresolved_mass: 1

relation_budget_scheduler:
  enabled: false
  mode: shadow
  calibration_file: null

micro_planner:
  enabled: false
  mode: shadow
  historical_bins: null
  planner_calibration: null

layer6_integration:
  enabled: false
  mode: shadow
