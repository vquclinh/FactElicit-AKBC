# COVER-KBC V3.1 - full TRAIN recollection profile. PREPARED, NOT RUN.
#
# Audit 0077 section 15. This profile exists so that, once targeted diagnostics
# justify promoting one or more Class-B features, the recollection run is a
# reviewed artifact rather than something improvised at GPU time.
#
# DO NOT RUN IT YET. Which Class-B features belong here is decided by the
# targeted diagnostics (configs/experiments/v3_1_diag_*.yaml) against the
# promotion gates in audit 0077 section 14. Until then every aggressive flag
# below is FALSE, and running this profile would just reproduce V3 collection
# at full cost.
#
# WHY A NEW COLLECTION IS NEEDED AT ALL
# Class-B features change the evidence the models generate, which changes the
# action-effect distribution M20/M21 were derived from. A calibration cannot be
# re-derived from the old collection: the old collection recorded a different
# system. The order is fixed and no step may be skipped:
#
#   1. promote features here (one line each, from the diagnostics);
#   2. run this collection on TRAIN;
#   3. check coverage sufficiency;
#   4. re-derive M21;
#   5. decide M20 inherit-vs-re-derive ON EVIDENCE (see below);
#   6. re-validate production readiness;
#   7. only then may a TEST profile claim FULL_TEST_READY.
#
# M20 IS NOT AUTOMATICALLY RE-DERIVED
# Audit 0073 inherited frozen M20 because the action-effect observations were
# not a complete relation-spend sample. Changing prompts does not by itself make
# that sample complete, and does not by itself justify re-estimating a budget
# scheduler. Step 5 is a decision to be made from the new collection's coverage,
# not a default. `m20_policy: undecided` below records that it is open.
#
# ISOLATION FROM EARLIER COLLECTIONS
# A new output namespace and a new collection-policy version, so audits 0070,
# 0071, 0072 and the authoritative v3_train_collect_v2_coverage artifacts cannot
# be overwritten. The Audit-0073 calibration files are inputs to nothing here;
# this run produces candidates for a *new* derivation.
#
# CALIBRATION STATUS: CALIBRATION_REVIEW_REQUIRED (always, by construction).

experiment:
  name: cover_kbc_v3_1_train_collection
  split: train
  seed: 42
  notes: >-
    V3.1 full TRAIN recollection profile. PREPARED BUT NOT RUN: the Class-B
    features to promote are decided by the targeted diagnostics first. Real
    weight run belongs on Colab/A100. V3.1 aggressive production calibration and
    official TEST remain NOT_READY until a new M21 derivation is validated.
  prepared_not_run: true
  requires_promotion_decision: true

model_profile:
  enumerator:
    backend: huggingface
    model_id: "mistralai/Mistral-Small-3.2-24B-Instruct-2506"
    revision: "95a6d26c4bfb886c58daf9d3f7332c857cb27b43"
    family: mistral
    role: enumerator
    license: apache-2.0
    published_checkpoint_parameters: 24011361280
    budget_count_parameters: 24011361280
    published_total_parameters: 24011361280
    parameter_source: "https://huggingface.co/api/models/mistralai/Mistral-Small-3.2-24B-Instruct-2506 (safetensors.total)"
    parameter_source_verified: true
    tokenizer_backend: mistral_common
    quantization: nf4
    torch_dtype: bfloat16
    device_map: auto
  verifier:
    backend: huggingface
    model_id: "Qwen/Qwen3.5-4B"
    revision: "851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a"
    family: qwen
    role: verifier
    license: apache-2.0
    published_checkpoint_parameters: 4659865088
    budget_count_parameters: 4659865088
    published_total_parameters: 4659865088
    parameter_source: "https://huggingface.co/api/models/Qwen/Qwen3.5-4B (safetensors.total)"
    parameter_source_verified: true
    tokenizer_backend: huggingface
    quantization: nf4
    torch_dtype: bfloat16
    device_map: auto

budget_assertion:
  total_published_parameters: 28671226368
  limit: 32000000000
  legal: true

train_dataset:
  rows: 477
  sha256: ad37cd30d1ff4b9f1ef2579b25e64093b202c40da11e8c412e13386f1e5d332e
  identity_sha256: 04b56aa6f401f00ca8d672a8d6cade09cfa2492640aac16a9aab8bc42c1b8054

diagnostics:
  enabled: true
  telemetry_file: inference_telemetry.jsonl

development_subset:
  purpose: deterministic source/debug smoke only; not calibration
  selection: first_n_by_official_train_order
  rows: 24

train_collection:
  # New policy version: a V3.1 collection is not interchangeable with the V3
  # collect-v2-coverage corpus and must never be merged into it.
  policy: collect-v3-1-class-b
  coverage_target_per_family: 10
  output_namespace: outputs/v3_1_train_collect_class_b
  overwrite_protected_namespaces:
    - outputs/v3_train_collect_v2_coverage
    - outputs/v3_train_error_forensics

# Where a NEW derivation would write. The Audit-0073 files under
# configs/calibration/v3/ are deliberately not named here: this run must not be
# able to overwrite the calibration the frozen submission depends on.
v3_1_calibration_outputs:
  m21_historical_bins: configs/calibration/v3_1/m21_historical_bins.json
  m21_planner_calibration: configs/calibration/v3_1/m21_planner_calibration.json
  # Open question, to be decided from the new collection's coverage. Audit 0073
  # inherited a frozen M20 because the action-effect observations were not a
  # complete relation-spend sample; changing prompts does not by itself make
  # that sample complete.
  m20_policy: undecided

# Read-only inputs. Listed separately from the outputs above so that "what this
# run may write" and "what this run may read" cannot be confused: nothing under
# configs/calibration/v3/ appears as an output anywhere in this profile.
v3_1_calibration_inputs:
  m20_candidate_for_inheritance: configs/calibration/v3/m20_relation_budget.json

pipeline:
  mode: interleaved
  enable_active_controller: true
  max_steps_per_query: 12
  max_control_rounds_per_catalogue: 3
  max_calls_per_query: 12
  max_generated_tokens_per_query: 6000
  enable_calibrated_gate: true
  gate_min_margin: 1.0
  gate_min_prob: 0.5
  enable_verifier: true
  use_calibration: true
  max_verifications_per_query: 6
  enable_prompt_disagreement: true
  enable_cross_model_recall: true
  cross_model_view: ""
  v3_core:
    enabled: true
    mode: train_collection
    schema_version: v3-core-v1
    production_calibration_ready: false
  scoring:
    alpha_support: 1.0
    beta_logit: 0.6
    gamma_cross_model: 0.5
    delta_contradiction: 1.5
    eta_disagreement: 1.0
    auto_accept_support: 3
    verify_max_support: 2
    adversarial_disagreement: 0.15
    accept_score: 0.2
    min_valid_prob: 0.40
    drop_on_unknown: true
    logit_clip: 3.0
    logit_epsilon: 1.0e-6
  selection:
    capacity_support_ratio: 1.0
    capacity_trust_verified: true
    v3_1:
      enabled: true
      safe:
        # The Class-A stack travels with the collection so the collected run is
        # the system a V3.1 submission would actually be.
        final_candidate_retention: true
        enumeration_label_repair: true
        stock_structural_validation: true
        numeric_output_canonicalization: true
        stock_support_dominance: true
      aggressive:
        # ALL FALSE UNTIL PROMOTED. Flip a line here only with a diagnostic
        # result behind it, and record which diagnostic in the audit.
        capacity_definition_prompt: false
        city_of_death_contrast_prompt: false
        stock_listing_entity_prompt: false
        award_expansion_and_fp_cap: false
        scientific_notation_acquisition: false

